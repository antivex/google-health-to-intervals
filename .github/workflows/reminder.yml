name: Reminder

# Once a day: when the Google authorization expires within 36 hours (day 6 of 7)
# this run turns red on purpose, so GitHub sends you an email. The run summary
# says "expires tomorrow" and contains the link to renew it.
# To get the summary without the red run and the email, create the repository
# variable GHTI_REMINDER_EMAIL with the value "false".
on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  # `ghti status` can refresh the authorization (the 7-day guess of a project in
  # "Testing" mode runs out before Google's own date). Google may hand back a NEW
  # refresh token, and the old one then stops working: if this run cannot commit it,
  # the token kept in state/ is dead and every later sync fails. So: write, and the
  # same state lock as the other workflows.
  contents: write

concurrency:
  group: ghti-state
  cancel-in-progress: false

jobs:
  check-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      GHTI_TIMEZONE: ${{ vars.GHTI_TIMEZONE }}
      GHTI_TOKEN_FILE: state/token.enc
      REMINDER_EMAIL: ${{ vars.GHTI_REMINDER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Check when the Google authorization expires
        run: |
          if [ "$REMINDER_EMAIL" = "false" ]; then
            uv run --frozen ghti status --skip-if-unconfigured
          else
            uv run --frozen ghti status --skip-if-unconfigured --fail-on-reminder
          fi

      - name: Save the encrypted token if the reminder refreshed it
        if: always()
        run: |
          git add -A state
          if git diff --cached --quiet; then
            echo "Token unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save refreshed encrypted Google token"
          git pull --rebase --quiet
          git push
