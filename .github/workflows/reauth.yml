name: Re-authorize

# Run it once with an empty box to get the Google link, then again with the
# address your browser ended on. See "Weekly re-authorization" in the README.
on:
  workflow_dispatch:
    inputs:
      redirect_url:
        description: "Paste the whole address from the browser (http://127.0.0.1:8765/?state=...). Leave empty to get a new link."
        required: false
        default: ""

permissions:
  contents: write # to save the encrypted token in state/

concurrency:
  group: ghti-state
  cancel-in-progress: false

jobs:
  reauth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
      GHTI_TIMEZONE: ${{ vars.GHTI_TIMEZONE }}
      GHTI_TOKEN_FILE: state/token.enc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Show the authorization link
        if: inputs.redirect_url == ''
        run: uv run --frozen ghti auth-url

      - name: Save the authorization
        if: inputs.redirect_url != ''
        env:
          # Passed as an environment variable, never pasted into the script.
          GHTI_REDIRECT_URL: ${{ inputs.redirect_url }}
        run: uv run --frozen ghti auth-finish

      - name: Commit the encrypted token
        if: inputs.redirect_url != ''
        run: bash .github/save-state.sh

      - name: Copy the days missed while the authorization was expired
        if: inputs.redirect_url != ''
        env:
          DAYS: ${{ vars.GHTI_CATCH_UP_DAYS || '14' }}
        run: uv run --frozen ghti sync --days "$DAYS"

      # That catch-up is a sync like any other: it can stop part-way and write
      # the note of the gap it left, and it can receive a new refresh token.
      # Without this step both stay on the runner and die with it - the note of
      # a gap nobody will name again.
      - name: Save what the catch-up sync left in state/ (token, open gap)
        if: always() && inputs.redirect_url != ''
        run: bash .github/save-state.sh "Save what the catch-up sync left (token, open gap)"
