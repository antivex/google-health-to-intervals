name: Check setup

# One click, no schedule: it says what is ready and what is missing, and writes
# nothing to intervals.icu. Run it after adding the secrets, or whenever a sync
# stops working. See "Check the setup" in the README.
on:
  workflow_dispatch:

permissions:
  contents: write # the check refreshes the Google token, which may need saving

concurrency:
  group: ghti-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
      GHTI_TIMEZONE: ${{ vars.GHTI_TIMEZONE }}
      GHTI_TOKEN_FILE: state/token.enc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Check the setup
        run: uv run --frozen ghti check

      - name: Save the encrypted token if the check refreshed it
        if: always()
        run: bash .github/save-state.sh "Save refreshed encrypted Google token"
